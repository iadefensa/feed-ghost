name: "Update feeds"

on:
  schedule:
    # Daily at 04:17 UTC (low-traffic window; offset avoids top-of-hour queue spikes)
    # https://crontab.guru/
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Prevent a manual run from racing a scheduled one
concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  update-feeds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: "Install dependencies"
        run: pip install -r requirements.txt
      - name: "Generate feeds"
        run: python generate-feeds.py
      - name: "Validate feeds"
        run: |
          python - <<'EOF'
          import glob
          import xml.etree.ElementTree as ET
          for file in glob.glob("feeds/*.xml"):
              ET.parse(file)
          EOF
      - name: "Commit changes"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -d feeds/ ]; then git add feeds/; fi
          if [ -f generate-feeds.log ]; then git add generate-feeds.log; fi
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update feeds ($(date -u '+%Y-%m-%d'))"
            git pull --rebase
            git push
          fi