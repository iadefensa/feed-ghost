name: "Tests"

on:
  # Limited to code changes, so that daily feed updates in forks don’t trigger runs
  push:
    branches: main
    paths: ["**.py", "requirements.txt", ".github/workflows/tests.yml"]
  pull_request:
    paths: ["**.py", "requirements.txt", ".github/workflows/tests.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: "Check out repository"
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: "Install dependencies"
        run: pip install -r requirements.txt
      - name: "Run tests"
        run: python -m unittest discover -s test